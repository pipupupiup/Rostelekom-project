# GraphHopper для ADO: только автомобильный профиль `car` с CH (быстрые запросы по многим точкам).
# Основа — config-example.yml проекта GraphHopper; сервер слушает 0.0.0.0:8989 внутри контейнера.
graphhopper:
  datareader.file: ""
  graph.location: /data/graph-cache
  profiles:
    - name: car
      custom_model_files: [car.json]
  profiles_ch:
    - profile: car
  profiles_lm: []
  graph.encoded_values: car_access, car_average_speed, country, road_class, roundabout, max_speed, road_environment, ferry_speed
  import.osm.ignored_highways: footway,cycleway,path,pedestrian,steps
  prepare.min_network_size: 200
  prepare.subnetworks.threads: 1
  routing.non_ch.max_waypoint_distance: 1000000
  graph.dataaccess.default_type: RAM_STORE

server:
  application_connectors:
    - type: http
      port: 8989
      bind_host: 0.0.0.0
      max_request_header_size: 50k
  request_log:
    appenders: []
  admin_connectors:
    - type: http
      port: 8990
      bind_host: 127.0.0.1
logging:
  appenders:
    - type: console
      threshold: INFO
